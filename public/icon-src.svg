<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Rose/pink background matching app theme -->
  <rect width="512" height="512" rx="112" fill="#fb7185"/>

  <!--
    Big toes face CENTER. Toes scaled large enough to read at 60px phone icon.
    Left foot : translate(138,275) rotate(-15) — big toe at +x (right/inner)
    Right foot: translate(374,275) rotate(+15) — big toe at -x (left/inner)
    Sole: center=(0,10), rx=46, ry=70. Sole top at y=-60.
    Toe bottoms all ≤ y=-71 → clear ~11px gap above sole top.
  -->

  <!-- Left foot -->
  <g transform="translate(138, 275) rotate(-15)">
    <ellipse cx="0" cy="10" rx="46" ry="70" fill="white"/>
    <circle cx="32"  cy="-95"  r="24" fill="white"/>
    <circle cx="12"  cy="-108" r="19" fill="white"/>
    <circle cx="-7"  cy="-111" r="17" fill="white"/>
    <circle cx="-24" cy="-105" r="15" fill="white"/>
    <circle cx="-37" cy="-93"  r="12" fill="white"/>
  </g>

  <!-- Right foot -->
  <g transform="translate(374, 275) rotate(15)">
    <ellipse cx="0" cy="10" rx="46" ry="70" fill="white"/>
    <circle cx="-32" cy="-95"  r="24" fill="white"/>
    <circle cx="-12" cy="-108" r="19" fill="white"/>
    <circle cx="7"   cy="-111" r="17" fill="white"/>
    <circle cx="24"  cy="-105" r="15" fill="white"/>
    <circle cx="37"  cy="-93"  r="12" fill="white"/>
  </g>
</svg>
